name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: false
      - name: Check developer scripts
        run: bash -n bin/dev bin/install bin/doctor scripts/test-mcp-stdio.sh scripts/test-federation-cli.sh
      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following Go files need gofmt:"
            echo "$files"
            exit 1
          fi
      - name: Verify modules
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./cmd/... ./internal/...
      - name: Coverage gate
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Total production statement coverage: ${total}%"
          awk -v total="$total" 'BEGIN { if (total + 0 < 60.0) exit 1 }'
      - name: Build
        run: go build ./cmd/specview
      - name: MCP binary stdio smoke
        run: bash scripts/test-mcp-stdio.sh ./specview
      - name: Federation CLI binary smoke
        run: bash scripts/test-federation-cli.sh ./specview

  browser-e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser semantic tests
        run: npm run test:e2e
      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: specview-browser-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore

  build-artifacts:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: false
      - name: Build release archives
        run: ./scripts/build-release.sh "dev-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v7
        with:
          name: specview-build-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
      - name: Installation command
        run: |
          {
            echo '## Install Specview'
            echo
            echo 'After publishing a GitHub Release:'
            echo
            echo '```bash'
            echo 'curl -fsSL https://raw.githubusercontent.com/sergii/specview/main/install.sh | sh'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
