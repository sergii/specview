name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v0.0.1
        required: true
        default: v0.0.1

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: false
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version='${{ inputs.version }}'
          else
            version='${GITHUB_REF_NAME}'
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid version: $version" >&2
            exit 1
          }
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Test
        run: go test ./...
      - name: Build release archives
        run: ./scripts/build-release.sh "${{ steps.version.outputs.value }}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists" >&2
            exit 1
          fi
          gh release create "$version" dist/* \
            --target "$GITHUB_SHA" \
            --title "Specview $version" \
            --generate-notes
      - name: Installation command
        run: |
          {
            echo '## Specview released'
            echo
            echo '```bash'
            echo 'curl -fsSL https://raw.githubusercontent.com/sergii/specview/main/install.sh | sh'
            echo '```'
            echo
            echo 'Then:'
            echo
            echo '```bash'
            echo 'specview init'
            echo 'specview'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
