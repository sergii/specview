{{define "detail.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Spec.Title}} - Specview</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #0b0d10; color: #f5f7fa; }
    header { padding: 22px 32px; border-bottom: 1px solid #242831; }
    header a { color: #aeb6c2; text-decoration: none; font-size: 13px; }
    main { max-width: 860px; margin: 0 auto; padding: 36px 28px 72px; }
    .eyebrow { color: #8f98a6; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    h1 { margin: 8px 0 12px; font-size: 30px; letter-spacing: -.03em; }
    .metadata { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 28px; color: #8f98a6; font-size: 12px; }
    .status { color: #d7dde6; }
    .error { margin: 18px 0; padding: 12px 14px; border: 1px solid #6f3e3e; border-radius: 8px; color: #ef9a9a; background: #1d1315; }
    article { border-top: 1px solid #242831; padding-top: 28px; color: #d7dce4; line-height: 1.65; }
    article h1, article h2, article h3 { color: #f5f7fa; }
    article code { padding: 2px 5px; border-radius: 5px; background: #1b2028; }
    article pre { overflow: auto; padding: 14px; border-radius: 8px; background: #11151a; }
    article pre code { padding: 0; background: transparent; }
    @media (max-width: 700px) { header { padding: 18px; } main { padding: 26px 18px 56px; } }
  </style>
</head>
<body>
<header><a href="/">← Specview / {{.RepoName}}</a></header>
<main>
  <div class="eyebrow">{{.Spec.Path}}</div>
  <h1>{{.Spec.Title}}</h1>
  <div class="metadata">
    <span class="status">{{.Spec.Status}}</span>
    <span>modified {{since .Spec.ModifiedAt}}</span>
  </div>
  {{if .Spec.Error}}<div class="error">{{.Spec.Error}}</div>{{end}}
  <article><pre>{{.Spec.Body}}</pre></article>
</main>
<script>
  const events = new EventSource('/events');
  events.addEventListener('changed', () => window.location.reload());
</script>
</body>
</html>
{{end}}
