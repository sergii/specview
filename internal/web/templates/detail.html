{{define "detail.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Spec.Title}} - Specview</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --page: #ffffff;
      --surface: #ffffff;
      --text: #151515;
      --muted: #6f6f69;
      --quiet: #a0a099;
      --line: #d8d8d2;
      --error: #b04b43;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; background: var(--page); color: var(--text); -webkit-font-smoothing: antialiased; }
    .app-shell { min-height: 100vh; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
    .topbar {
      min-height: 54px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 0 26px;
      border-bottom: 1px solid var(--line);
    }
    .brand { color: var(--text); font-family: inherit; font-size: 15px; font-weight: 500; letter-spacing: -0.012em; text-decoration: none; }
    .brand:hover { color: var(--text); }
    .view-label { color: var(--muted); font-size: 12px; letter-spacing: .02em; }
    .back { justify-self: end; color: var(--muted); font-size: 12px; text-decoration: none; }
    .back:hover { color: var(--text); }
    main { max-width: 1280px; padding: 56px 68px 84px; }
    .eyebrow-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .24em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .eyebrow-line {
      width: 128px;
      border-top: 1px solid var(--line);
      transform: translateY(1px);
    }
    h1 {
      max-width: 980px;
      margin: 0;
      font-size: clamp(62px, 9vw, 96px);
      font-weight: 420;
      line-height: .92;
      letter-spacing: -0.07em;
    }
    .metadata {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 22px;
      margin-top: 30px;
      color: var(--muted);
      font-size: 12px;
    }
    .metadata .status { color: var(--text); text-transform: capitalize; }
    .metadata .path { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--quiet); }
    .rule { margin: 34px 0 28px; border-top: 1px solid var(--line); }
    .error {
      margin-bottom: 22px;
      padding: 12px 14px;
      border: 1px solid #e2c9c5;
      background: #fffdfd;
      color: var(--error);
      font-size: 11px;
      line-height: 1.5;
    }
    article {
      max-width: 900px;
      color: #4d4d48;
      font-size: 14px;
      line-height: 1.72;
    }
    article > :first-child { margin-top: 0; }
    article h2,
    article h3,
    article h4 {
      color: var(--text);
      font-weight: 560;
      letter-spacing: -0.02em;
    }
    article h2 { margin: 34px 0 10px; font-size: 20px; line-height: 1.25; }
    article h3 { margin: 28px 0 8px; font-size: 16px; line-height: 1.35; }
    article h4 { margin: 24px 0 8px; font-size: 14px; line-height: 1.4; }
    article p { margin: 0 0 16px; }
    article ul,
    article ol { margin: 0 0 18px; padding-left: 22px; }
    article li { margin: 4px 0; }
    article a { color: var(--text); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    article blockquote { margin: 20px 0; padding-left: 14px; border-left: 1px solid var(--line); color: var(--muted); }
    article code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; }
    article :not(pre) > code { padding: 1px 4px; border: 1px solid var(--line); }
    article pre {
      margin: 20px 0;
      padding: 14px 16px;
      overflow: auto;
      border: 1px solid var(--line);
      background: transparent;
      color: #41413d;
      font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    article pre code { font: inherit; }
    article table { width: 100%; margin: 20px 0; border-collapse: collapse; font-size: 13px; }
    article th,
    article td { padding: 8px 10px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
    article th { color: var(--text); font-weight: 560; }
    article hr { margin: 28px 0; border: 0; border-top: 1px solid var(--line); }
    article input[type="checkbox"] { margin-right: 7px; accent-color: var(--text); }
    @media (max-width: 720px) {
      .topbar { grid-template-columns: 1fr auto; padding: 0 16px; }
      .view-label { display: none; }
      main { padding: 38px 16px 56px; }
      .eyebrow-line { width: 92px; }
      h1 { font-size: 56px; }
      .metadata { gap: 8px 14px; }
      .rule { margin: 26px 0 22px; }
      article h2 { font-size: 18px; }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <a class="brand" href="/" aria-label="Back to Specview board">Specview</a>
    <div class="view-label">Specification</div>
    <a class="back" href="/">← Board</a>
  </header>
  <main>
    <div class="eyebrow-row"><div class="eyebrow">Specification</div><div class="eyebrow-line"></div></div>
    <h1>{{.Spec.Title}}</h1>
    <div class="metadata"><span class="status">{{.Spec.Status}}</span><span class="path">{{.Spec.Path}}</span><span>Modified {{since .Spec.ModifiedAt}}</span></div>
    <div class="rule"></div>
    {{if .Spec.Error}}<div class="error">{{.Spec.Error}}</div>{{end}}
    <article>{{markdownBody .Spec.Body .Spec.Title}}</article>
  </main>
</div>
<script>const events = new EventSource('/events'); events.addEventListener('changed', () => window.location.reload());</script>
</body>
</html>
{{end}}
