{{define "detail.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Spec.Title}} - Specview</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #f7f7f5;
      --surface: #fbfbf9;
      --line: #d9d8d2;
      --text: #121416;
      --text-secondary: #686b65;
      --text-muted: #8b9088;
      --red-line: #d9c6c6;
      --red-text: #9a6868;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .app {
      margin: 12px auto;
      width: min(100%, 1920px);
      min-height: calc(100vh - 24px);
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      background: var(--bg);
    }
    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      padding: 20px 28px;
      border-bottom: 1px solid var(--line);
    }
    .brand { font-size: 16px; font-weight: 600; }
    .context {
      justify-self: center;
      color: var(--text-muted);
      font-size: 13px;
      letter-spacing: .02em;
    }
    .back {
      justify-self: end;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
    }
    .content {
      max-width: 1420px;
      padding: 48px 68px 84px;
    }
    .eyebrow-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .eyebrow {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .32em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .eyebrow-line {
      width: 120px;
      border-top: 1px solid var(--line);
      transform: translateY(1px);
    }
    h1 {
      margin: 0;
      max-width: 1080px;
      font-size: clamp(62px, 7vw, 90px);
      line-height: 0.94;
      letter-spacing: -0.065em;
      font-weight: 400;
    }
    .metadata {
      display: flex;
      flex-wrap: wrap;
      gap: 20px 28px;
      margin-top: 30px;
      color: var(--text-secondary);
      font-size: 14px;
    }
    .metadata .path {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--text-muted);
      font-size: 13px;
    }
    .rule {
      margin: 38px 0 34px;
      border-top: 1px solid var(--line);
    }
    .error {
      margin-bottom: 26px;
      padding: 15px 18px;
      border: 1px solid var(--red-line);
      border-radius: 12px;
      color: var(--red-text);
      background: var(--surface);
      font-size: 14px;
      line-height: 1.5;
    }
    article {
      color: #5e625d;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 15px;
      line-height: 1.9;
      white-space: pre-wrap;
    }
    @media (max-width: 900px) {
      .content { padding: 34px 28px 64px; }
    }
    @media (max-width: 700px) {
      .app { margin: 0; min-height: 100vh; border-radius: 0; border-left: 0; border-right: 0; }
      .topbar { grid-template-columns: 1fr auto; grid-template-areas: "brand back" "context context"; gap: 10px 16px; padding: 16px 18px; }
      .brand { grid-area: brand; }
      .back { grid-area: back; }
      .context { grid-area: context; justify-self: start; }
      .content { padding: 26px 18px 48px; }
      h1 { font-size: 52px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">Specview</div>
    <div class="context">Specification</div>
    <a class="back" href="/">← Board</a>
  </header>

  <main class="content">
    <div class="eyebrow-row"><div class="eyebrow">Specification</div><div class="eyebrow-line"></div></div>
    <h1>{{.Spec.Title}}</h1>
    <div class="metadata">
      <span>{{.Spec.Status}}</span>
      <span class="path">{{.Spec.Path}}</span>
      <span>Modified {{since .Spec.ModifiedAt}}</span>
    </div>
    <div class="rule"></div>
    {{if .Spec.Error}}<div class="error">{{.Spec.Error}}</div>{{end}}
    <article>{{.Spec.Body}}</article>
  </main>
</div>
<script>
  const events = new EventSource('/events');
  events.addEventListener('changed', () => window.location.reload());
</script>
</body>
</html>
{{end}}
