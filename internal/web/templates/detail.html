{{define "detail.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Spec.Title}} - Specview</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --page:#f2f2ef;
      --surface:#fbfbf9;
      --text:#171715;
      --muted:#76766f;
      --quiet:#a0a099;
      --line:#ddddd7;
      --line-strong:#ccccc5;
      --error:#b04b43;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--page);color:var(--text);-webkit-font-smoothing:antialiased}
    .app-shell{min-height:calc(100vh - 28px);margin:14px;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
    .topbar{min-height:52px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:0 22px;border-bottom:1px solid var(--line)}
    .brand{font-size:15px;font-weight:650;letter-spacing:-.02em}
    .view-label{color:var(--muted);font-size:12px}
    .back{justify-self:end;color:var(--muted);font-size:12px;text-decoration:none}
    .back:hover{color:var(--text)}
    main{max-width:980px;margin:0 auto;padding:54px 34px 78px}
    .eyebrow{margin-bottom:12px;color:var(--muted);font-size:10px;font-weight:650;letter-spacing:.13em;text-transform:uppercase}
    h1{max-width:820px;margin:0;font-size:clamp(38px,7vw,72px);font-weight:500;line-height:.96;letter-spacing:-.05em}
    .metadata{display:flex;flex-wrap:wrap;gap:9px 20px;margin-top:28px;color:var(--muted);font-size:11px}
    .metadata .status{color:var(--text);text-transform:capitalize}
    .metadata .path{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .error{margin-top:28px;padding:13px 14px;border:1px solid #e2c9c5;border-radius:8px;background:#fbf5f4;color:var(--error);font-size:11px;line-height:1.5}
    article{margin-top:42px;padding-top:28px;border-top:1px solid var(--line);color:#4d4d48;line-height:1.65}
    article pre{margin:0;padding:0;overflow:auto;white-space:pre-wrap;word-break:break-word;background:transparent;color:inherit;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media(max-width:700px){.app-shell{margin:8px;min-height:calc(100vh - 16px);border-radius:13px}.topbar{grid-template-columns:1fr auto;padding:0 14px}.view-label{display:none}main{padding:38px 18px 58px}.metadata{gap:8px 14px}article{margin-top:34px}}
  </style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand">Specview</div>
    <div class="view-label">Specification</div>
    <a class="back" href="/">← Board</a>
  </header>
  <main>
    <div class="eyebrow">Specification</div>
    <h1>{{.Spec.Title}}</h1>
    <div class="metadata"><span class="status">{{.Spec.Status}}</span><span class="path">{{.Spec.Path}}</span><span>Modified {{since .Spec.ModifiedAt}}</span></div>
    {{if .Spec.Error}}<div class="error">{{.Spec.Error}}</div>{{end}}
    <article><pre>{{.Spec.Body}}</pre></article>
  </main>
</div>
<script>const events=new EventSource('/events');events.addEventListener('changed',()=>window.location.reload());</script>
</body>
</html>
{{end}}
